<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SparKnife Ledger">
	<!--
		آیکون دفتر حساب: دو ردیف دفتر با فلش مقابل هم.
		بالا پول ورودی (راست)، پایین پول خروجی (چپ). همان چیزی که
		کاربر در صفحهٔ اصلی می‌بیند: بدهکار و بستانکار.

		رنگ‌ها از پالت خود افزونه گرفته شده‌اند تا در منوی وردپرس با
		بقیهٔ آیکون‌ها ناهمگون نباشد.
	-->
	<g fill="none" stroke-linecap="round">
		<!-- ردیف بالا: خط + سر پیکان راست -->
		<path d="M5.5 11.5 H19.5" stroke="#ffffff" stroke-width="3.2"/>
		<path d="M20.5 6.5 L27 11.5 L20.5 16.5 Z" fill="#E9A23B"/>

		<!-- ردیف پایین: خط + سر پیکان چپ -->
		<path d="M26.5 20.5 H12.5" stroke="#ffffff" stroke-width="3.2"/>
		<path d="M11.5 15.5 L5 20.5 L11.5 25.5 Z" fill="#E9A23B"/>
	</g>
</svg>
